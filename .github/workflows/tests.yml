name: Tests

on:
  pull_request:
  push:
    branches: [main, test]
  merge_group:

permissions:
  contents: read

jobs:

  # Disabled until tsls is released on PyPI: the packaging check installs the
  # built wheel, which can't resolve the tsls dependency (it's only available
  # from GitHub for now). Turn this back on when there's a tsls package.
  # packaging:
  #   name: Python packaging
  #   uses: tskit-dev/.github/.github/workflows/python-packaging.yml@v22
  #   with:
  #     cli-test-cmd: tsinfer --help

  test-c:
    name: C tests
    uses: tskit-dev/.github/.github/workflows/c-tests.yml@v22
    with:
      library-directory: lib
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  test-python-c:
    name: Python-C tests
    uses: tskit-dev/.github/.github/workflows/python-c-tests.yml@v22
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  test:
    name: Python
    uses: tskit-dev/.github/.github/workflows/python-tests.yml@v22
    with:
      os: ${{ matrix.os }}
      python-version: ${{ matrix.python }}
      coverage-directory: tsinfer
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    strategy:
      matrix:
        python: [ 3.12, 3.14 ]
        os:  [ macos-latest, ubuntu-24.04, windows-latest ]
